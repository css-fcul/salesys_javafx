<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Products — SaleSys</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
  <h1>Products 📦</h1>
  <div th:if="${message}" class="message" th:text="${message}">Success message</div>
  
  <div th:if="${#lists.isEmpty(products)}">
    <p>No products yet.</p>
  </div>
  
  <table th:if="${!#lists.isEmpty(products)}">
    <thead>
      <tr>
        <th>Code</th>
        <th>Description</th>
        <th>Face Value</th>
        <th>Stock</th>
      </tr>
    </thead>
    <tbody>
      <tr th:each="p : ${products}">
        <td th:text="${p.code}"></td>
        <td th:text="${p.description}"></td>
        <td th:text="${p.faceValue}"></td>
        <td th:text="${p.stockQuantity}"></td>
      </tr>
    </tbody>
  </table>
  
  <p class="actions">
    <a class="btn" href="/web/products/new">+ Add Product</a>
    <a class="btn" href="/">← Back to Home</a>
  </p>
</body>
</html>
